[build-system]
requires = [
    "cython",
    "setuptools>=77.0",
    "setuptools_scm[toml]>=6.2"
]
build-backend = "setuptools.build_meta"

[project]
name = "pyhacl"
version = "0.0.0"
description = "Python binding to the HACL* library"
readme = "README.md"
requires-python = ">=3.11"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [
  { name="Julien Castiaux", email="julien.castiaux@mailfence.com" },
]
keywords = [

]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Documentation = "https://github.com/Julien00859/pyhacl/wiki"
Issue = "https://github.com/Julien00859/pyhacl/issues"
Repository = "https://github.com/Julien00859/pyhacl"

[project.optional-dependencies]
dev = [
    "Cython",
    "parameterized",
]

[project.scripts]
pyhacl = "pyhacl.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyhacl = ["hacl-packages"]
